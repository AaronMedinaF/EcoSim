<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECOSIM</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="cv"></canvas>

<div id="menu">
  <div class="card">
    <h1>ECOSIM</h1><p class="sub">Un sandbox de ecosistemas. Crea un mundo, suelta vida y mira qué pasa.</p>
    <h3>CREAR ECOSISTEMA</h3>
    <div id="maps" class="grid5"></div>
    <div class="sl"><label>🌱 Plantas <b id="vp"></b></label><input type="range" id="np" min="0" max="400" step="10"></div>
    <div class="sl"><label>🦌 Herbívoros <b id="vh"></b></label><input type="range" id="nh" min="0" max="100" step="1"></div>
    <div class="sl"><label>🐺 Carnívoros <b id="vc"></b></label><input type="range" id="nc" min="0" max="30" step="1"></div>
    <div id="diffs" class="seg"></div>
    <button id="create" class="big">CREAR MUNDO</button>
    <div id="menuSaves"></div>
    <button id="resume" class="ghost" hidden>↩ Volver al mundo actual</button>
  </div>
</div>

<div id="hud"></div>
<div id="bar">
  <button id="bPlay" title="Pausa/Play">⏸️</button>
  <span id="speeds"></span>
  <button id="bSkip" title="Saltar 1 día">⏭️ 1 día</button>
  <button id="bDoc" title="Modo documental">🎥</button>
  <button id="bFit" title="Ver todo el mapa">🗺️</button>
  <button id="bMus" title="Música">🎵</button>
  <button id="bFx" title="Efectos">🔊</button>
  <button id="bMenu" title="Menú">🏠</button>
</div>
<div id="banner" hidden></div>
<div id="ticker"></div>
<div id="dock"><div id="tabs"></div><div id="panel"></div></div>
<div id="toasts"></div>

<script src="js/core.js"></script>
<script src="js/genetics.js"></script>
<script src="js/plants.js"></script>
<script src="js/animals.js"></script>
<script src="js/events.js"></script>
<script src="js/story.js"></script>
<script src="js/meta.js"></script>
<script src="js/experiments.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
