<html lang="es">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EcoSim</title>

</head>
<body>
<div class="app">
  <main><canvas id="world"></canvas></main>
  <aside>
    <h1>EcoSim</h1>
    <section id="stats"></section>
    <section class="controls">
      <button id="toggle">Pausar</button>
      <button id="reset">Reiniciar</button>
      <label>Velocidad <select id="speed"></select></label>
      <label class="check"><input type="checkbox" id="perception"> Mostrar percepción</label>
    </section>
    <section id="spawners"><h2>Spawn manual</h2></section>
  </aside>
</div>
<script src="js/utils.js"></script>
<script src="js/config.js"></script>
<script src="js/entities/organism.js"></script>

<script src="js/systems/feeding.js"></script>
<script src="js/systems/combat.js"></script>
<script src="js/systems/lifecycle.js"></script>
<script src="js/systems/sizing.js"></script>
<script src="js/systems/effects.js"></script>
<script src="js/systems/stats.js"></script>
<script src="js/behaviors/common.js"></script>
<script src="js/behaviors/herbivore.js"></script>
<script src="js/behaviors/carnivore.js"></script>
